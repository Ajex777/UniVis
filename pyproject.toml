[project]
name = "univis"
version = "0.1.0"
description = "PolicyEpisode web visualization and review tool."
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "fastapi>=0.115.0",
    "h5py>=3.11.0",
    "numpy>=1.24.0",
    "pillow>=10.4.0",
    "python-multipart>=0.0.12",
    "pydantic>=2.8.0",
    "uvicorn[standard]>=0.30.0",
    "h5ffmpeg>=2.4.0",
    "av>=17.0.1",
    "pyarrow>=24.0.0",
    "pyyaml>=6.0.3",
    "matplotlib>=3.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "httpx>=0.27.0",
]

[project.scripts]
univis = "univis.app:main"
univis-dtw = "univis.cli_dtw:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
