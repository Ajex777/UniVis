# Default configuration for UniVis DTW trajectory quality checks.
#
# This file is loaded by the backend through `QualityConfig`.
# GUI and future CLI entrypoints should share this backend-managed config
# instead of maintaining separate DTW defaults.

quality:
  # Registered quality backend class name.
  backend: DTWTrajectoryQualityBackend
  # Human-readable explanation only; not used by the algorithm.
  description: Relative dual-arm EEF pose consistency with dynamic time warping.

pose_distance:
  # DTW compares every current/reference frame pair with one scalar pose cost:
  #
  #   sqrt((position_error / scale_m)^2 + (rotation_error / scale_rad)^2)
  #
  # Smaller scales make the metric stricter; larger scales make it more tolerant.
  position:
    # Position normalization scale in meters.
    # 0.01 means 1 cm position error contributes about 1.0 to the frame cost.
    scale_m: 0.01
  rotation:
    # Rotation normalization scale in degrees.
    # 5.0 means 5 degrees orientation error contributes about 1.0 to frame cost.
    scale_deg: 5.0

alignment:
  window:
    # Enable Sakoe-Chiba style DTW windowing.
    # This prevents extreme time-warping matches and reduces compute for long trajectories.
    enabled: true
    # Window width as a ratio of max(current_length, reference_length).
    # 0.2 allows matching frames within about 20% of the trajectory length.
    # Set enabled=false to allow unrestricted DTW.
    ratio: 0.2

visualization:
  alignment_links:
    # Maximum number of DTW matching links sent to the frontend for 3D rendering.
    # This only decimates the visual line overlay; it does not change DTW metrics.
    max_count: 120

statistics:
  # Percentile used for high-error summaries.
  # 95.0 reports p95 position/rotation error after DTW alignment.
  percentile: 95.0
